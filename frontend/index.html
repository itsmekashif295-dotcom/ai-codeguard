<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CodeGuard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; padding: 20px; margin: 0; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { text-align: center; margin-bottom: 10px; font-size: 28px; }
        p.subtitle { text-align: center; color: #aaa; margin-bottom: 20px; font-size: 14px; }
        
        .upload-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;}
        .upload-btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .upload-btn:hover { background: #444; }
        #fileName { font-size: 13px; color: #00ff00; }
        
        textarea { width: 100%; box-sizing: border-box; height: 200px; background: #0d0d0d; color: #00ff00; border: 1px solid #333; padding: 15px; font-family: 'Courier New', monospace; border-radius: 5px; resize: vertical; font-size: 14px; }
        .btn-container { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        button#scanBtn { background: #007bff; color: white; border: none; padding: 12px 25px; font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; width: 100%; }
        button#scanBtn:hover { background: #0056b3; }
        button#scanBtn:disabled { background: #555; cursor: not-allowed; }
        
        .spinner { display: none; width: 24px; height: 24px; border: 4px solid #333; border-top: 4px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #result { margin-top: 25px; display: none; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 8px; border-left: 5px solid #ff4444; margin-bottom: 15px; }
        .card.safe { border-left-color: #00C851; }
        .badge { display: inline-block; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 12px; margin-bottom: 10px; text-transform: uppercase; }
        .high { background: #ff4444; color: white; }
        .medium { background: #ffbb33; color: black; }
        .low { background: #33b5e5; color: white; }
        .safe-text { color: #00C851; font-weight: bold; font-size: 18px; }
        p.detail { margin: 8px 0; line-height: 1.5; color: #ddd; font-size: 14px; }
        .label { color: #888; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 3px; }
        
        /* Mobile Responsive */
        @media (max-width: 600px) {
            .container { padding: 15px; }
            h1 { font-size: 22px; }
            textarea { height: 150px; }
            .upload-section { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ AI CodeGuard</h1>
        <p class="subtitle">Detect vulnerabilities in your Python code using Bandit + AI.</p>
        
        <div class="upload-section">
            <label for="fileInput" class="upload-btn">📁 Upload Python File</label>
            <input type="file" id="fileInput" accept=".py" style="display: none;">
            <span id="fileName">No file selected (or paste code below)</span>
        </div>

        <textarea id="codeInput" placeholder="Paste your Python code here..."></textarea>
        
        <div class="btn-container">
            <button onclick="scanCode()" id="scanBtn">Scan Code</button>
        </div>
        <div class="spinner" id="spinner"></div>
        
        <div id="result"></div>
    </div>

    <script>
        // File Upload Logic
        const fileInput = document.getElementById('fileInput');
        const codeInput = document.getElementById('codeInput');
        const fileName = document.getElementById('fileName');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            fileName.innerText = "Selected: " + file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                codeInput.value = e.target.result;
            };
            reader.readAsText(file);
        });

        // Scan Logic
        async function scanCode() {
            const code = codeInput.value.trim();
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('scanBtn');
            const spinner = document.getElementById('spinner');
            
            if (!code) {
                alert("Please paste some code or upload a file first!");
                return;
            }

            resultDiv.style.display = "none";
            resultDiv.innerHTML = "";
            btn.disabled = true;
            btn.innerText = "Scanning...";
            spinner.style.display = "block";

            try {
                const response = await fetch('http://127.0.0.1:8000/scan/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, language: "python", filename: "uploaded_file.py" })
                });
                
                const data = await response.json();
                resultDiv.style.display = "block";

                if (data.total_findings === 0) {
                    resultDiv.innerHTML = `<div class="card safe"><span class="safe-text">✅ No vulnerabilities found!</span><p class="detail">Your code looks safe from known static analysis checks.</p></div>`;
                } else {
                    data.findings.forEach(f => {
                        let sevClass = f.severity === 'HIGH' ? 'high' : (f.severity === 'MEDIUM' ? 'medium' : 'low');
                        let aiExplain = f.ai_explanation || "AI analysis unavailable.";
                        let aiFix = f.ai_fix || "No fix provided.";
                        
                        resultDiv.innerHTML += `
                        <div class="card">
                            <span class="badge ${sevClass}">${f.severity}</span> 
                            <span style="color:#fff; font-weight:bold;">${f.cwe || 'Unknown CWE'}</span> (Line ${f.line})
                            <p class="detail"><span class="label">Issue:</span> ${f.description}</p>
                            <p class="detail"><span class="label">AI Explanation:</span> ${aiExplain}</p>
                            <p class="detail"><span class="label">Recommended Fix:</span> ${aiFix}</p>
                            <p class="detail"><span class="label">Confidence Score:</span> ${f.confidence_score}/100</p>
                        </div>
                        `;
                    });
                }
            } catch (error) {
                resultDiv.style.display = "block";
                resultDiv.innerHTML = `<div class="card"><p class="detail" style="color:#ff4444;">Error: ${error.message}</p></div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Scan Code";
                spinner.style.display = "none";
            }
        }
    </script>
</body>
</html>
