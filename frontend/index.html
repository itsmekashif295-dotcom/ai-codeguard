<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI CodeGuard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { text-align: center; margin-bottom: 20px; }
        textarea { width: 100%; height: 200px; background: #0d0d0d; color: #00ff00; border: 1px solid #333; padding: 15px; font-family: 'Courier New', monospace; border-radius: 5px; resize: vertical; }
        .btn-container { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        button { background: #007bff; color: white; border: none; padding: 12px 25px; font-size: 16px; cursor: pointer; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #0056b3; }
        button:disabled { background: #555; cursor: not-allowed; }
        
        /* Loading Spinner */
        .spinner { display: none; width: 24px; height: 24px; border: 4px solid #333; border-top: 4px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        #result { margin-top: 25px; display: none; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 8px; border-left: 5px solid #ff4444; margin-bottom: 15px; }
        .card.safe { border-left-color: #00C851; }
        .badge { display: inline-block; padding: 5px 10px; border-radius: 5px; font-weight: bold; font-size: 14px; margin-bottom: 10px; }
        .high { background: #ff4444; color: white; }
        .medium { background: #ffbb33; color: black; }
        .safe-text { color: #00C851; font-weight: bold; font-size: 18px; }
        p { margin: 8px 0; line-height: 1.5; color: #ddd; }
        .label { color: #888; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛡️ AI CodeGuard</h1>
        <p style="text-align:center; color:#aaa;">Paste your Python code below to check for vulnerabilities.</p>
        
        <textarea id="codeInput">import os
os.system('ls ' + input())</textarea>
        
        <div class="btn-container">
            <button onclick="scanCode()" id="scanBtn">Scan Code</button>
            <div class="spinner" id="spinner"></div>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        async function scanCode() {
            const code = document.getElementById('codeInput').value;
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('scanBtn');
            const spinner = document.getElementById('spinner');
            
            // UI Reset
            resultDiv.style.display = "none";
            resultDiv.innerHTML = "";
            btn.disabled = true;
            btn.innerText = "Scanning...";
            spinner.style.display = "block";

            try {
                // API Call
                const response = await fetch('http://127.0.0.1:8000/scan/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, language: "python", filename: "test.py" })
                });
                
                const data = await response.json();
                resultDiv.style.display = "block";

                if (data.total_findings === 0) {
                    resultDiv.innerHTML = `<div class="card safe"><span class="safe-text">✅ No vulnerabilities found in ${data.filename}!</span></div>`;
                } else {
                    data.findings.forEach(f => {
                        let sevClass = f.severity === 'HIGH' ? 'high' : 'medium';
                        let aiExplain = f.ai_explanation || "AI analysis unavailable.";
                        let aiFix = f.ai_fix || "No fix provided.";
                        
                        resultDiv.innerHTML += `
                        <div class="card">
                            <span class="badge ${sevClass}">${f.severity}</span> 
                            <span style="color:#fff; font-weight:bold;">${f.cwe || 'Unknown CWE'}</span> (Line ${f.line})
                            <p><span class="label">Issue:</span> ${f.description}</p>
                            <p><span class="label">AI Explanation:</span> ${aiExplain}</p>
                            <p><span class="label">Recommended Fix:</span> ${aiFix}</p>
                            <p><span class="label">Confidence Score:</span> ${f.confidence_score}/100</p>
                        </div>
                        `;
                    });
                }
            } catch (error) {
                resultDiv.style.display = "block";
                resultDiv.innerHTML = `<div class="card"><p style="color:#ff4444;">Error: ${error.message}</p></div>`;
            } finally {
                btn.disabled = false;
                btn.innerText = "Scan Code";
                spinner.style.display = "none";
            }
        }
    </script>
</body>
</html>
